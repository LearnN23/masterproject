<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CallReady: speaking pretest and lessons for IT support English</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎧%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#EEF2F4; --surface:#FFFFFF; --ink:#16252E; --slate:#51636E; --line:#D3DCE1;
  --signal:#0A6F6A; --signal-ink:#FFFFFF; --signal-soft:#DDF0EE; --live:#C2362C; --live-soft:#FBE6E3; --amber:#946200; --amber-soft:#FFF1D1;
  --f-display:"Bricolage Grotesque","IBM Plex Sans Thai",system-ui,sans-serif; --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1A20; --surface:#17262E; --ink:#E7EEF1; --slate:#9DB0BA; --line:#2C404A; --signal:#4FC3BA; --signal-ink:#06201E; --signal-soft:#143A38; --live:#FF7A6E; --live-soft:#3B1D1B; --amber:#F0B54A; --amber-soft:#3A2D10;}}
:root[data-theme="dark"]{--paper:#0F1A20; --surface:#17262E; --ink:#E7EEF1; --slate:#9DB0BA; --line:#2C404A; --signal:#4FC3BA; --signal-ink:#06201E; --signal-soft:#143A38; --live:#FF7A6E; --live-soft:#3B1D1B; --amber:#F0B54A; --amber-soft:#3A2D10;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:700}
h3{font-size:1.05rem;margin:1.2em 0 .4em}
p{margin:.5em 0}
.sub{color:var(--slate);margin-top:-.2em}
.hint{color:var(--slate);font-size:.88rem}
.note{background:var(--amber-soft);color:var(--amber);padding:8px 12px;border-radius:6px;font-size:.88rem}
code{background:var(--paper);padding:1px 5px;border-radius:4px;font-size:.85em}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px clamp(14px,3vw,28px);background:var(--surface);border-bottom:1px solid var(--line)}
.brand b{font:700 1.25rem var(--f-display);letter-spacing:-.02em;color:var(--signal)}
.brand span{margin-left:10px;color:var(--slate);font-size:.88rem}
.topr{display:flex;gap:14px;align-items:center;font-size:.88rem}
.who{color:var(--slate)}
.link{background:none;border:0;padding:0;color:var(--signal);text-decoration:underline;font-size:.88rem}

.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:clamp(16px,3vw,40px);max-width:1120px;margin:0 auto;padding:24px clamp(14px,3vw,28px) 64px}
.layout.norail{grid-template-columns:minmax(0,760px)}
main{min-width:0;max-width:760px}
.rail{position:sticky;top:16px;align-self:start;font-size:.9rem}
.railhead{font:600 .8rem var(--f-body);color:var(--slate);margin-bottom:8px}
.rail ol{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.rail li button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:7px 8px 7px 0;margin-left:-11px;color:var(--ink)}
.rail .dot{flex:0 0 20px;height:20px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-size:.7rem;line-height:1}
.rail li.cur button{font-weight:600}
.rail li.cur .dot{border-color:var(--signal);background:var(--signal)}
.rail li.done .dot{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.rail li.lock button{color:var(--slate)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin:14px 0}
.card.soft{background:var(--paper)}
.btn{display:inline-block;background:var(--signal);color:var(--signal-ink);border:0;border-radius:8px;padding:11px 20px;font-weight:600;margin-top:10px}
.btn.ghost{background:transparent;color:var(--signal);border:1.5px solid var(--signal)}
.btn.stop{background:var(--live);color:#fff}
.mini{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--signal);background:transparent;color:var(--signal);font-size:.8rem;flex:0 0 32px}
label{display:block;font-weight:500;margin-bottom:4px}
input[type=text],input:not([type]),textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
textarea{resize:vertical}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:8px 0}
.chk input{margin-top:5px;flex:0 0 auto}
.chk.small{font-size:.88rem;color:var(--slate)}
.plain{padding-left:1.2em;margin:.6em 0}
.plain li{margin:.3em 0}
.steps{padding-left:1.3em}.steps li{margin:.7em 0}
.toast{background:var(--signal-soft);border-left:4px solid var(--signal);padding:10px 14px;border-radius:6px;margin-bottom:14px}
.tag{display:inline-block;background:var(--signal-soft);color:var(--signal);padding:2px 10px;border-radius:99px;font-size:.85rem;font-weight:500}
.chip{display:inline-block;background:var(--paper);border:1px solid var(--line);padding:3px 10px;border-radius:6px;font-size:.88rem;margin:2px 2px 2px 0}
.btnchip{background:var(--surface);border:1.5px solid var(--signal);color:var(--ink);font-size:.95rem;padding:7px 12px;text-align:left}
.count{color:var(--slate);font-size:.9rem;font-weight:500}

/* Pretest console */
.queue{display:flex;gap:6px;margin:8px 0 16px}
.queue i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.queue i.d{background:var(--signal)}.queue i.c{background:var(--ink)}
.console{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.callbar{display:flex;gap:28px;padding:14px 22px;background:var(--ink);color:var(--paper)}
.callbar small{display:block;opacity:.7;font-size:.78rem}
.callbar b{font-family:var(--f-display);font-size:1.1rem}
.setting{padding:16px 22px 0;margin:0;font-size:1.05rem}
.infocard{margin:14px 22px 0;padding:10px 14px;background:var(--amber-soft);border-radius:8px;color:var(--ink)}
.infocard small,.todo small{display:block;color:var(--slate);font-weight:600;font-size:.8rem;margin-bottom:2px}
.todo{margin:14px 22px 0}.todo ul{margin:.2em 0;padding-left:1.2em}
.ctl{padding:18px 22px 24px;border-top:1px solid var(--line);margin-top:18px}
.play{display:flex;align-items:center;gap:16px;width:100%;padding:18px 22px;border-radius:12px;border:2px solid var(--signal);background:var(--signal-soft);font-weight:600;font-size:1.05rem;text-align:left}
.play .bars{display:flex;gap:4px;align-items:center;height:30px}
.play .bars i{width:5px;height:10px;background:var(--signal);border-radius:3px}
.play.on .bars i{animation:wave .9s ease-in-out infinite}
.play.on .bars i:nth-child(2){animation-delay:.12s}.play.on .bars i:nth-child(3){animation-delay:.24s}.play.on .bars i:nth-child(4){animation-delay:.36s}.play.on .bars i:nth-child(5){animation-delay:.48s}
@keyframes wave{0%,100%{height:8px}50%{height:28px}}
@media (prefers-reduced-motion:reduce){.play.on .bars i{animation:none;height:20px}}
.clock{display:flex;align-items:center;gap:18px;padding:6px 0}
.clock .big{font:700 3rem var(--f-display);font-variant-numeric:tabular-nums;min-width:2.2em}
.clock.rec .big{color:var(--live)}.clock.sm .big{font-size:1.8rem}
.live{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--live)}
.live i{width:12px;height:12px;border-radius:50%;background:var(--live);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
audio{width:100%;margin:10px 0}

/* Lessons */
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin:14px 0 6px}
.tabs button{background:none;border:0;padding:9px 14px;color:var(--slate);border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:500}
.tabs button.on{color:var(--ink);border-color:var(--signal);font-weight:600}
.navrow{display:flex;justify-content:space-between;margin-top:6px}
.phr,.dlg{list-style:none;padding:0;margin:8px 0}
.phr li,.dlg li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.phr li small,.dlg li small{grid-column:1/-1;color:var(--slate);font-size:.8rem}
.dlg li.A span{font-weight:500}
.dlg li.C span{color:var(--slate)}
.dlg li.T{background:var(--paper)}
.quote{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--paper);border-left:4px solid var(--ink);padding:12px 16px;border-radius:0 8px 8px 0;margin:10px 0}
.q{margin:20px 0}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;margin:6px 0}
.opt:hover:not(:disabled){border-color:var(--signal)}
.opt.ok{background:var(--signal-soft);border-color:var(--signal);opacity:1}
.opt.bad{background:var(--live-soft);border-color:var(--live);opacity:1}
.opt:disabled{opacity:.85}
.why{padding:8px 12px;border-radius:6px;background:var(--live-soft);font-size:.92rem}
.why.good{background:var(--signal-soft)}
.slots{display:grid;gap:6px;margin:8px 0}
.slot{display:flex;gap:10px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px}
.slot b{color:var(--signal);min-width:1.2em}
.slot.ok{border-color:var(--signal);background:var(--signal-soft)}.slot.bad{border-color:var(--live);background:var(--live-soft)}
.pool{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.lcard{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.lcard b{font-family:var(--f-display)}.lcard small{color:var(--slate)}
.lcard.done{border-color:var(--signal)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--signal)}
.req{list-style:none;padding:0}.req li::before{content:"○ ";color:var(--slate)}.req li.y::before{content:"✓ ";color:var(--signal)}
.model{background:var(--paper);padding:10px 14px;border-radius:8px}
details summary{cursor:pointer;font-weight:500;margin:8px 0}

/* Researcher */
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;margin:10px 0}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.up{display:inline-block;border:1.5px solid var(--signal);color:var(--signal);padding:3px 10px;border-radius:6px;cursor:pointer;font-weight:500;font-size:.85rem;margin:0}
.rate{border-top:1px solid var(--line);padding:6px 0}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0}
.seg{display:flex;gap:4px}.seg button{flex:1;padding:6px 0;border:1.5px solid var(--line);background:var(--surface);border-radius:6px}.seg button.on{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.hero{padding-top:6vh}.hero .lead{font-size:1.15rem;max-width:34em}

@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .rail{position:static}
  .rail ol{display:flex;gap:6px;overflow-x:auto;border:0;padding-bottom:6px}
  .rail li{flex:0 0 auto}.rail li button{margin:0;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface);width:auto}
  .rail .dot{display:none}.rail li.done button::after{content:" ✓"}
  .railhead{display:none}
  .brand span{display:none}
  .callbar{gap:18px}.tbl{display:block;overflow-x:auto}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== STUDY CONTENT (edit here; the app reads everything from these objects) ===== */
const N_ADS = 29;
const AUDIO_URLS = {}; // optional: { p1: "audio/p1.mp3", ... } when you host your own pre-recorded files

const RUBRIC = [
  { key: "task", name: "Task completion", what: "Responds to the customer's purpose and covers the required steps.",
    a4: "All required moves made, fully relevant", a2: "Some moves missing or only partly relevant", a0: "No relevant response" },
  { key: "clarity", name: "Clarity and organisation", what: "Information and instructions are understandable and in logical order.",
    a4: "Clear, logically ordered, easy to follow", a2: "Understandable but order or detail unclear", a0: "Cannot be understood" },
  { key: "interact", name: "Interaction strategies", what: "Asks relevant questions, clarifies, confirms understanding.",
    a4: "Uses questions and checks naturally", a2: "Few or mechanical checks", a0: "No interaction strategies" },
  { key: "tone", name: "Professional tone", what: "Polite, customer-appropriate language; handles concerns respectfully.",
    a4: "Consistently polite and customer-focused", a2: "Mostly polite, some abrupt or flat phrasing", a0: "Impolite or inappropriate" },
  { key: "lang", name: "Language control", what: "Grammar and vocabulary accurate enough to communicate meaning.",
    a4: "Errors rare, never block meaning", a2: "Frequent errors, meaning mostly clear", a0: "Errors block meaning" }
];

const TASKS = {
  enq:   { name: "Responding to customer enquiries",              f: 29, fns: ["Suggesting solutions", "Confirming understanding", "Requesting repetition", "Closing an interaction politely"] },
  clar:  { name: "Identifying and clarifying technical problems", f: 29, fns: ["Asking for information", "Asking clarifying questions", "Describing symptoms or errors"] },
  expl:  { name: "Explaining technical information",              f: 29, fns: ["Explaining technical problems", "Confirming understanding"] },
  instr: { name: "Giving instructions or guidance",               f: 29, fns: ["Giving instructions", "Checking whether a solution works"] },
  comp:  { name: "Handling customer complaints",                  f: 29, fns: ["Apologizing and responding to complaints", "Reassuring customers"] },
  esc:   { name: "Escalating unresolved cases",                   f: 29, fns: ["Escalating cases", "Reassuring customers"] },
  coord: { name: "Coordinating with internal teams",              f: 29, fns: ["Requesting assistance", "Reporting problems"] },
  doc:   { name: "Documenting cases or updating tickets",         f: 29, fns: ["Summarizing and documenting information"] }
};

/* ---- Speaking pretest: one simulated call per lesson task ---- */
const PRETEST = [
  { id: "p1", task: "enq", caller: "Ms Aisyah", channel: "Phone", voice: { pitch: 1.15, rate: 0.92 },
    setting: "You are a support agent at Brightlink, a broadband and IT service company. A new customer calls.",
    script: "Hello, good morning. I'm calling about your broadband plans. I saw an advertisement for a new fibre package, and I'd like to know the price and whether it's available in my area.",
    todo: ["Open the call politely", "Respond to the enquiry (you do not need exact prices)", "Ask for the information you need", "Close politely"] },
  { id: "p2", task: "clar", caller: "Mr Tan", channel: "Phone", voice: { pitch: 0.85, rate: 0.95 },
    setting: "A customer calls about a laptop problem. He is not sure what is wrong.",
    script: "Hi. My laptop has not been working properly since yesterday. It is very slow and sometimes the screen just goes black. I don't know what the problem is.",
    todo: ["Ask at least three clarifying questions", "Confirm what you understand about the problem"] },
  { id: "p3", task: "expl", caller: "Ms Priya", channel: "Live chat (voice note)", voice: { pitch: 1.1, rate: 0.9 },
    setting: "A customer is not confident with technology and has sent a voice note.",
    script: "I got an error message that says, DNS server not responding. What does that actually mean? I'm not very good with computers, so please explain it simply.",
    todo: ["Explain the problem in plain language", "Avoid unexplained technical terms", "Check that the customer understands"] },
  { id: "p4", task: "instr", caller: "Mr Hafiz", channel: "Phone", voice: { pitch: 0.9, rate: 0.93 },
    setting: "A customer wants to reset his email password. Assume he has the login page open.",
    script: "Okay, so I want to reset my email password, but I can't find where to do it. Can you guide me, please?",
    todo: ["Give clear steps in order (at least four)", "Use sequencing language", "Check whether each step worked"] },
  { id: "p5", task: "comp", caller: "Mrs Lim", channel: "Phone", voice: { pitch: 1.0, rate: 1.05 },
    setting: "A customer is angry. This is her third call about the same internet outage.",
    script: "This is the third time I'm calling! My internet has been down for two days and nobody has fixed it. I work from home and I'm losing money. I'm really frustrated!",
    todo: ["Acknowledge the problem and apologise", "Show you understand how she feels", "Say what you will do next", "Reassure her"] },
  { id: "p6", task: "esc", caller: "Mr Daniel Wong", channel: "Phone", voice: { pitch: 0.88, rate: 0.95 },
    setting: "You restarted the router with the customer and checked the cables. The fault is still there. You must escalate to the Tier-2 technical team.",
    script: "I've already restarted the router like you said, and the light is still red. So what else can we do?",
    info: "Case reference: BL-48210. Tier-2 will call back within 24 hours.",
    todo: ["Tell the customer you are escalating the case, and why", "Explain what happens next and when", "Give the reference number", "Check the customer is happy with this"] },
  { id: "p7", task: "coord", caller: "Mr Lim", channel: "Phone", voice: { pitch: 0.92, rate: 0.93 },
    setting: "You have just spoken to the logistics team about this customer's replacement modem. The customer calls back for an update.",
    script: "Hello, it's Mr Lim again. Did you speak to your logistics team? I'd like to know what they said about my replacement modem.",
    info: "Logistics said: the modem was shipped today. It arrives in two working days. Tracking number: MY-70231.",
    todo: ["Report what the internal team told you", "Give the delivery details clearly", "Offer further help"] },
  { id: "p8", task: "doc", caller: "Ms Nurul", channel: "Phone", voice: { pitch: 1.12, rate: 0.94 },
    setting: "You have fixed a customer's Wi-Fi problem by changing the channel on her router. Before she hangs up, she asks about your records.",
    script: "Thank you, it's working now. Before I go, could you tell me exactly what you are going to write in my case record, so I know it's correct?",
    info: "Your notes: Wi-Fi dropping every evening. Router restarted, no change. Changed Wi-Fi channel from 11 to 6. Connection stable. No further action.",
    todo: ["Summarise the issue", "Say what you did", "State the outcome and next step"] }
];

/* ---- Lessons: sequenced as the stages of a real support interaction ---- */
const LESSONS = [
  { n: 1, task: "enq", title: "Opening, answering and closing an enquiry",
    why: "Every one of the 29 advertisements asks for staff who respond to customer enquiries, so this is where the call begins.",
    outcomes: ["Open a call in a professional, friendly way", "Respond to a general enquiry and offer a next step", "Ask a customer to repeat, and close politely"],
    phrases: [
      ["Opening", "Thank you for calling Brightlink Support. How may I assist you today?"],
      ["Responding", "I'd be happy to help you with that."],
      ["Asking for details", "May I have your name and account number, please?"],
      ["Requesting repetition", "Sorry, could you repeat that more slowly, please?"],
      ["Suggesting a solution", "One option is to upgrade to our fibre plan."],
      ["Closing", "Is there anything else I can help you with today?"],
      ["Closing", "Thank you for contacting us. Have a good day."] ],
    dialogue: [
      ["C", "Hello? Is this the support line?"],
      ["A", "Yes, it is. Thank you for calling Brightlink Support. How may I assist you today?"],
      ["C", "I'd like to change my broadband plan, but I'm not sure which one is suitable."],
      ["A", "I'd be happy to help you with that. May I have your name and account number, please?"],
      ["C", "It's Aisyah Rahman, and the number is 4 4 7 0 2 1."],
      ["A", "Thank you, Ms Rahman. One option is to upgrade to our fibre plan. Is there anything else I can help you with today?"] ],
    mcq: [
      { q: "A customer says only, \"Hello?\" Which is the best way to open the call?",
        o: ["Yes? What do you want?", "Thank you for calling Brightlink Support. How may I assist you today?", "Hello. Tell me your problem.", "Please wait."], a: 1,
        why: "It names the company, thanks the caller and invites them to explain. The other options sound abrupt." },
      { q: "You could not hear the customer's account number. What should you say?",
        o: ["What? Again.", "Your voice is bad.", "Sorry, could you repeat that more slowly, please?", "I can't hear. Call again."], a: 2,
        why: "A polite apology plus a clear request keeps the customer comfortable and gets the information you need." } ],
    order: { prompt: "Put the stages of a customer enquiry in order.",
      steps: ["Greet the customer and offer help", "Listen to the enquiry", "Ask for the details you need", "Answer and suggest an option", "Ask if there is anything else", "Close the call politely"] },
    speak: { customer: "Hi, I'm thinking of changing my internet plan. Can you tell me about your options?",
      checklist: ["I opened the call politely", "I asked for at least one detail", "I suggested an option", "I offered more help and closed politely"],
      model: "Thank you for calling Brightlink Support. I'd be happy to help. May I have your name and your current plan, please? ... One option is our fibre plan, which is faster. Is there anything else I can help you with today? Thank you for calling." } },

  { n: 2, task: "clar", title: "Finding the real problem",
    why: "Identifying and clarifying technical problems appears in all 29 advertisements. Customers rarely describe a fault clearly, so good questions come first.",
    outcomes: ["Ask open and closed questions to find the cause", "Understand customers' descriptions of symptoms", "Confirm the problem before acting"],
    phrases: [
      ["Open question", "Could you tell me exactly what happens when you try to connect?"],
      ["Timing", "When did the problem start?"],
      ["Error message", "Are you seeing any error message on the screen?"],
      ["Previous steps", "What have you tried so far?"],
      ["Scope", "Is the problem on one device, or on all your devices?"],
      ["Confirming", "Just to confirm, the Wi-Fi drops every evening. Is that right?"],
      ["Summarising", "Let me make sure I understand. You can connect, but the pages load very slowly."] ],
    dialogue: [
      ["C", "My Wi-Fi isn't working."],
      ["A", "I'm sorry to hear that. Could you tell me exactly what happens when you try to connect?"],
      ["C", "My phone connects, but there's no internet."],
      ["A", "I see. Is the problem on one device, or on all your devices?"],
      ["C", "My laptop has the same problem."],

/* ===== CallReady app ===== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(Math.floor(s % 60)).padStart(2, "0");

/* ---------- storage (all wrapped: storage can be empty or blocked) ---------- */
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } }
};
let dbp = null;
function idb() {
  if (dbp) return dbp;
  dbp = new Promise(res => {
    try {
      const rq = indexedDB.open("callready", 1);
      rq.onupgradeneeded = () => { rq.result.createObjectStore("kv"); };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => res(null);
    } catch (e) { res(null); }
  });
  return dbp;
}
const memStore = {};
async function kvGet(k) {
  const db = await idb(); if (!db) return memStore[k] || null;
  return new Promise(res => { try { const r = db.transaction("kv").objectStore("kv").get(k); r.onsuccess = () => res(r.result || memStore[k] || null); r.onerror = () => res(memStore[k] || null); } catch (e) { res(memStore[k] || null); } });
}
async function kvSet(k, v) {
  memStore[k] = v;
  const db = await idb(); if (!db) return;
  return new Promise(res => { try { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); } catch (e) { res(false); } });
}

/* ---------- state ---------- */
const blankState = pid => ({ pid, consent: false, micOk: false, view: "consent", pre: { idx: 0, done: false, items: {} }, les: {}, createdAt: new Date().toISOString() });
let S = null;
const U = { lessonStep: 0, mode: "participant", rtab: "audio", rater: { id: "", pkgs: [], scores: {} }, busy: false, msg: "" };
const save = () => { if (S) LS.set("cr_state_" + S.pid, JSON.stringify(S)); };
const lessonState = n => (S.les[n] = S.les[n] || { mcq: {}, order: null, reflect: "", rec: false, speakChecks: [], done: false, openedAt: Date.now() });
const lessonDone = n => !!(S.les[n] && S.les[n].done);
const lessonUnlocked = n => n === 1 || lessonDone(n - 1);
const doneCount = () => LESSONS.filter(l => lessonDone(l.n)).length;

/* ---------- audio: prompts, TTS, recording ---------- */
let curAudio = null, curUtter = null;
function stopSpeech() { try { speechSynthesis.cancel(); } catch (e) { /* none */ } if (curAudio) { try { curAudio.pause(); } catch (e) { /* none */ } curAudio = null; } }
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
    return vs.find(v => /en-(MY|SG|GB)/i.test(v.lang)) || vs.find(v => /en-US/i.test(v.lang)) || vs[0] || null;
  } catch (e) { return null; }
}
function speakText(text, voice = {}) {
  return new Promise(res => {
    stopSpeech();
    try {
      const u = new SpeechSynthesisUtterance(text); curUtter = u;
      const v = pickVoice(); if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-US";
      u.pitch = voice.pitch || 1; u.rate = voice.rate || 0.95;
      u.onend = () => res(true); u.onerror = () => res(false);
      speechSynthesis.speak(u);
    } catch (e) { res(false); }
  });
}
async function playBlobUrl(url) {
  return new Promise(res => { stopSpeech(); const a = new Audio(url); curAudio = a; a.onended = () => res(true); a.onerror = () => res(false); a.play().catch(() => res(false)); });
}
/* A pre-recorded prompt (uploaded by researcher in this browser, or hosted via AUDIO_URLS) wins over the browser voice. */
async function promptSource(item) {
  if (AUDIO_URLS[item.id]) return { type: "url", url: AUDIO_URLS[item.id] };
  const rec = await kvGet("prompt_" + item.id);
  if (rec && rec.blob) return { type: "blob", url: URL.createObjectURL(rec.blob) };
  return { type: "tts" };
}
async function playPrompt(item) {
  const src = await promptSource(item);
  if (src.type === "tts") return speakText(item.script, item.voice);
  return playBlobUrl(src.url);
}
function beep() {
  try { const c = new (window.AudioContext || window.webkitAudioContext)(); const o = c.createOscillator(); const g = c.createGain(); o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(c.destination); o.start(); setTimeout(() => { o.stop(); c.close(); }, 220); } catch (e) { /* ignore */ }
}
const REC = { stream: null, mr: null, chunks: [], timer: null, t0: 0 };
async function ensureMic() {
  if (REC.stream && REC.stream.active) return true;
  try { REC.stream = await navigator.mediaDevices.getUserMedia({ audio: true }); return true; } catch (e) { return false; }
}
function bestMime() {
  const c = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
  try { return c.find(m => MediaRecorder.isTypeSupported(m)) || ""; } catch (e) { return ""; }
}
function startRecording() {
  REC.chunks = [];
  const mime = bestMime();
  REC.mr = mime ? new MediaRecorder(REC.stream, { mimeType: mime }) : new MediaRecorder(REC.stream);
  REC.mr.ondataavailable = e => { if (e.data && e.data.size) REC.chunks.push(e.data); };
  REC.t0 = Date.now(); REC.mr.start();
}
function stopRecording() {
  return new Promise(res => {
    if (!REC.mr || REC.mr.state === "inactive") return res(null);
    REC.mr.onstop = () => { const type = REC.mr.mimeType || "audio/webm"; res({ blob: new Blob(REC.chunks, { type }), mime: type, sec: Math.round((Date.now() - REC.t0) / 100) / 10 }); };
    REC.mr.stop();
  });
}
const blobToB64 = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.readAsDataURL(b); });
const b64ToBlob = (b64, mime) => { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: mime }); };

/* ---------- downloads (viewer-confirmed; may be unavailable) ---------- */
let downloadsNs = null;
(async () => { try { downloadsNs = await claude.use("downloads"); } catch (e) { downloadsNs = null; } render(); })();
async function saveFile(filename, data) {
  if (!downloadsNs) { U.msg = "Saving files is not available in this view. Open the page in the Claude app or browser where downloads are enabled."; render(); return false; }
  try { await downloadsNs.save({ filename, data }); U.msg = "Saved: " + filename; render(); return true; }
  catch (e) { U.msg = e && e.code === "declined" ? "Save cancelled." : "Could not save the file (" + ((e && e.code) || "error") + ")."; render(); return false; }
}

/* ---------- small UI helpers ---------- */
const stageOf = () => {
  if (!S) return "welcome";
  if (S.view === "consent" || S.view === "setup") return "setup";
  if (S.view.startsWith("pre")) return "pre";
  if (S.view === "lesson") return "L" + U.lesson;
  if (S.view === "finish") return "finish";
  return "home";
};
function rail() {
  if (!S) return "";
  const st = stageOf();
  const preDone = S.pre.done;
  const items = [
    ["setup", "Consent and setup", true, S.consent && S.micOk !== null],
    ["pre", "Speaking pretest", S.consent, preDone],
    ...LESSONS.map(l => ["L" + l.n, "Lesson " + l.n + ". " + TASKS[l.task].name, preDone && lessonUnlocked(l.n), lessonDone(l.n)]),
    ["finish", "Finish and export", preDone, false]
  ];
  return `<nav class="rail" aria-label="Course route"><div class="railhead">Route</div><ol>` + items.map(([k, label, open, done]) =>
    `<li class="${st === k ? "cur" : ""} ${open ? "" : "lock"} ${done ? "done" : ""}"><button ${open ? "" : "disabled"} data-act="goto" data-k="${k}"><span class="dot">${done ? "✓" : open ? "" : "·"}</span><span>${esc(label)}</span></button></li>`).join("") + `</ol></nav>`;
}
function shell(inner, opts = {}) {
  const who = S ? `<span class="who">Participant ${esc(S.pid)}</span>` : "";
  return `<header class="top"><div class="brand"><b>CallReady</b><span>English for IT support calls</span></div><div class="topr">${who}<button class="link" data-act="${U.mode === "researcher" ? "exitres" : "res"}">${U.mode === "researcher" ? "Exit researcher tools" : "Researcher tools"}</button></div></header>

document.addEventListener("click", async e => {

  const a = el.dataset.act; U.keepScroll = false;
  if (a === "begin") return begin();
  if (a === "res") { U.mode = "researcher"; U.msg = ""; return render(); }
  if (a === "exitres") { U.mode = "participant"; U.msg = ""; return render(); }
  if (a === "rtab") { U.rtab = el.dataset.k; return render(); }
  if (a === "consent") { if (!$("#cons").checked) { U.msg = "Tick the box to agree before continuing."; return render(); } S.consent = true; return go("setup"); }
  if (a === "soundtest") { speakText("This is a sound check.", { pitch: 1, rate: 0.95 }); return; }
  if (a === "mictest") { const ok = await ensureMic(); S.micOk = ok; save(); const m = $("#micstate"); if (m) m.textContent = ok ? "Microphone is ready." : "Microphone not available. You can upload audio files instead."; return; }
  if (a === "tointro") return go("preintro");
  if (a === "startpre") { resetP(); P.started = null; while (S.pre.idx < PRETEST.length && (S.pre.items[PRETEST[S.pre.idx].id] || {}).done) S.pre.idx++; if (S.pre.idx >= PRETEST.length) { S.pre.idx = PRETEST.length - 1; S.pre.done = true; return go("predone"); } return go("preitem"); }
  if (a === "playp") { const it = PRETEST[S.pre.idx]; P.playing = true; P.plays++; itemState(it.id).plays = P.plays; save(); render(); await playPrompt(it); P.playing = false; if (S.view === "preitem") render(); return; }
  if (a === "prep") { stopSpeech(); return startPrep(); }
  if (a === "stoprec") return finishPre();
  if (a === "nextp") { if (S.pre.idx >= PRETEST.length - 1) { S.pre.done = true; S.pre.idx = PRETEST.length - 1; resetP(); P.started = null; return go("predone"); } S.pre.idx++; resetP(); P.started = null; save(); return render(); }
  if (a === "goto") { const k = el.dataset.k; if (k === "setup") return go(S.consent ? "setup" : "consent"); if (k === "pre") return go(S.pre.done ? "predone" : (S.pre.idx > 0 || Object.keys(S.pre.items).length ? "preintro" : "setup")); if (k === "finish") return go("finish"); if (k[0] === "L") { U.lesson = Number(k.slice(1)); U.lessonStep = 0; return go("lesson"); } }
  if (a === "L") { U.lesson = Number(el.dataset.n); U.lessonStep = 0; LR.phase = "idle"; LR.url = null; return go("lesson"); }
  if (a === "step") { U.lessonStep = Number(el.dataset.i); U.keepScroll = true; return render(); }
  if (a === "nextstep") { U.lessonStep = Math.min(STEPS.length - 1, U.lessonStep + 1); return render(); }
  if (a === "prevstep") { U.lessonStep = Math.max(0, U.lessonStep - 1); return render(); }
  if (a === "say") { let v = {}; try { v = JSON.parse(el.dataset.v); } catch (x) { /* ignore */ } speakText(el.dataset.t, v); return; }
  if (a === "sayall") { const l = LESSONS[U.lesson - 1]; for (const d of l.dialogue) { if (S.view !== "lesson") break; await speakText(d[1], d[0] === "A" ? { pitch: 1.05, rate: 0.95 } : { pitch: 0.82, rate: 0.95 }); } return; }
  if (a === "mcq") { const l = LESSONS[U.lesson - 1]; const ls = lessonState(l.n); const i = +el.dataset.i, j = +el.dataset.j; ls.mcq[i] = { choice: j, correct: j === l.mcq[i].a }; save(); U.keepScroll = true; return render(); }
  if (a === "pick" || a === "unpick" || a === "chkorder" || a === "resetorder") {
    const l = LESSONS[U.lesson - 1]; const ls = lessonState(l.n); ls.order = ls.order || { picked: [], checked: false, correct: false, attempts: 0 };
    if (a === "pick") ls.order.picked.push(+el.dataset.i);
    if (a === "unpick") ls.order.picked.splice(+el.dataset.k, 1);
    if (a === "resetorder") ls.order.picked = [];
    if (a === "chkorder") { ls.order.checked = true; ls.order.attempts++; ls.order.correct = ls.order.picked.every((v, k) => v === k); }
    save(); U.keepScroll = true; return render();
  }
  if (a === "lrec") { const ok = await ensureMic(); if (!ok) { U.msg = "Microphone not available. Tick 'I cannot record on this device' to continue."; return render(); } LR.phase = "rec"; LR.sec = 0; startRecording(); clearInterval(LR.timer); LR.timer = setInterval(() => { LR.sec++; const c = $(".clock .big"); if (c) c.textContent = fmt(LR.sec); if (LR.sec >= 90) stopL(); }, 1000); U.keepScroll = true; return render(); }
  if (a === "lstop") return stopL();
  if (a === "finishL") { const l = LESSONS[U.lesson - 1]; const ls = lessonState(l.n); if (!canFinish(l)) return; ls.done = true; ls.completedAt = new Date().toISOString(); save(); if (l.n < LESSONS.length) { U.lesson = l.n + 1; U.lessonStep = 0; LR.phase = "idle"; LR.url = null; return go("lesson"); } return go("finish"); }
  if (a === "export") { U.msg = "Preparing file…"; render(); const data = await buildPackage(); return saveFile(`CallReady_${S.pid}_results.json`, data); }
  /* researcher */
  if (a === "testprompt") { const it = PRETEST.find(p => p.id === el.dataset.id); return playPrompt(it); }
  if (a === "score") { const R = U.rater; const k = el.dataset.key; R.scores[k] = R.scores[k] || {}; R.scores[k][el.dataset.c] = +el.dataset.v; LS.set("cr_scores", JSON.stringify(R.scores)); const open = [...document.querySelectorAll("details.rate")].map(d => d.open); U.keepScroll = true; render(); document.querySelectorAll("details.rate").forEach((d, i) => { d.open = open[i]; }); return; }
  if (a === "exportscores") { const R = U.rater; const rows = [["participant", "rater", "call", "task", ...RUBRIC.map(r => r.key), "total_of_20"]]; for (const p of R.pkgs) for (const it of PRETEST) { const sc = R.scores[p.pid + "|" + it.id]; if (!sc) continue; rows.push([p.pid, R.id || "", it.id, it.task, ...RUBRIC.map(r => sc[r.key] == null ? "" : sc[r.key]), RUBRIC.reduce((s, r) => s + (sc[r.key] || 0), 0)]); } return saveFile("CallReady_scores.csv", rows.map(r => r.map(csvEsc).join(",")).join("\n")); }
});
async function stopL() {
  clearInterval(LR.timer); const r = await stopRecording(); LR.phase = "idle"; if (!r) return render();
  const l = LESSONS[U.lesson - 1]; const ls = lessonState(l.n);
  await kvSet(`lrec_${S.pid}_${l.n}`, { blob: r.blob, mime: r.mime }); ls.rec = true; LR.url = URL.createObjectURL(r.blob); save(); U.keepScroll = true; render();
}
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.id === "upl" && el.files[0]) { const f = el.files[0]; await commitPre(f, f.type || "audio/webm", 0, true); return; }
  if (el.dataset.act === "schk") { const ls = lessonState(U.lesson); const i = +el.dataset.i; ls.speakChecks = el.checked ? [...new Set([...ls.speakChecks, i])] : ls.speakChecks.filter(x => x !== i); save(); return; }
  if (el.dataset.act === "nomic") { lessonState(U.lesson).noMic = el.checked; save(); return; }
  if (el.dataset.act === "upprompt" && el.files[0]) { const id = el.dataset.id; await kvSet("prompt_" + id, { blob: el.files[0] }); const s = $("#ps_" + id); if (s) s.textContent = "Uploaded (this browser only)"; return; }
  if (el.id === "pkgs") { for (const f of el.files) { try { const j = JSON.parse(await f.text()); if (j.app === "CallReady") { U.rater.pkgs = U.rater.pkgs.filter(p => p.pid !== j.pid); U.rater.pkgs.push(j); } } catch (x) { U.msg = "Could not read " + f.name; } } try { U.rater.scores = Object.assign(JSON.parse(LS.get("cr_scores") || "{}"), U.rater.scores); } catch (x) { /* ignore */ } return render(); }
  if (el.id === "rid") { U.rater.id = el.value.trim(); return; }
});
document.addEventListener("input", e => { if (e.target.id === "reflect") { const ls = lessonState(U.lesson); ls.reflect = e.target.value; save(); const li = document.querySelector(".req li:last-child"); if (li) li.className = ls.reflect.trim().length > 5 ? "y" : ""; const b = document.querySelector('[data-act="finishL"]'); if (b) b.disabled = !canFinish(LESSONS[U.lesson - 1]); } });
try { speechSynthesis.getVoices(); } catch (e) { /* none */ }
render();

</script>
